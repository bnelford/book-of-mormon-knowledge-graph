name: Deploy to GitHub Pages

on:
  push:
    branches: [ main, master ]
  workflow_dispatch: # Allow manual deployment

# Do not run this workflow on pull_request. It executes repository code and
# publishes the site; a pull request run would put unreviewed files on GitHub Pages.
permissions:
  contents: read

# Allow only one concurrent deployment, skipping runs queued between the run in-progress and latest queued.
# However, do NOT cancel in-progress runs as we want to allow these production deployments to complete.
concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  # Build job
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: write
      pages: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: false
        
      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.9'
          
      - name: Validate knowledge graph
        run: |
          echo "🔍 Validating knowledge graph before deployment..."
          python3 validate.py
          
      - name: Test servers
        run: |
          echo "🔍 Testing servers before deployment..."

          # Test Python server
          timeout 10s python3 server.py &
          PYTHON_SERVER_PID=$!
          sleep 3

          if curl -f -s http://localhost:8000/knowledge-graph.html > /dev/null; then
            echo "✅ Python server works"
          else
            echo "❌ Python server failed"
            exit 1
          fi

          kill $PYTHON_SERVER_PID 2>/dev/null || true

          # Test Node.js server
          timeout 10s node server.js --port=8001 &
          NODE_SERVER_PID=$!
          sleep 3

          if curl -f -s http://localhost:8001/knowledge-graph.html > /dev/null; then
            echo "✅ Node.js server works"
          else
            echo "❌ Node.js server failed"
            exit 1
          fi

          kill $NODE_SERVER_PID 2>/dev/null || true
          
      - name: Setup Pages
        uses: actions/configure-pages@v4
        
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          # Upload entire repository as artifact
          path: '.'

  # Deployment job
  deploy:
    if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master'
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: ${{ github.ref_name == 'main' && 'prod' || 'dev' }}
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

# Ensure other workflows reference the appropriate environments
# For example, if there are workflows for testing or staging, update them to use "dev" or "prod" environments as needed.
